<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
   <title>القرآن الكريم - قراءة واستماع</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <img src="https://github.com/MOSTAFA-bot1/Quran/blob/main/Quran%20Photo.webp" alt="" srcset="">
    <div class="app-shell">
      <aside class="sidebar">
        <div class="sidebar-header">
          <div>
            <p class="eyebrow">Sacred Text</p>
            <h1>Quran قران</h1>
          </div>
          <p class="subtitle">Browse all 114 surahs in one place.</p>
          <label class="search-box" for="searchInput">
            <span>🔎</span>
            <input id="searchInput" type="text" placeholder="Search surah" />
          </label>
        </div>
        <div id="surahList" class="surah-list" aria-live="polite"></div>
      </aside>

      <main class="content">
        <header class="content-header">
          <div>
            <p id="surahBadge" class="badge">Loading...</p>
            <h2 id="surahTitle">Quran Surah Reader</h2>
            <p id="surahMeta" class="meta">Choose a surah to begin reading.</p>
          </div>
          <div class="content-actions">
            <button id="prevBtn" class="ghost-btn" type="button">◀ Previous</button>
            <button id="nextBtn" class="ghost-btn" type="button">Next ▶</button>
          </div>
        </header>

        <section class="audio-panel" aria-label="Surah recitation">
          <div class="record-stage" aria-hidden="true">
            <div class="record">
              <svg viewBox="0 0 128 128" role="presentation">
                <rect width="128" height="128" fill="#10131d"></rect>
                <circle cx="20" cy="20" r="2" fill="#fff"></circle>
                <circle cx="40" cy="30" r="2" fill="#fff"></circle>
                <circle cx="60" cy="10" r="2" fill="#fff"></circle>
                <circle cx="80" cy="40" r="2" fill="#fff"></circle>
                <circle cx="100" cy="20" r="2" fill="#fff"></circle>
                <circle cx="120" cy="50" r="2" fill="#fff"></circle>
                <circle cx="90" cy="30" r="10" fill="#fff" fill-opacity=".45"></circle>
                <circle cx="90" cy="30" r="8" fill="#fff"></circle>
                <path d="M0 128 Q32 64 64 128 T128 128" fill="#247d7a"></path>
                <path d="M0 128 Q32 48 64 128 T128 128" fill="#48b2a5"></path>
                <path d="M0 128 Q32 32 64 128 T128 128" fill="#86d2c1"></path>
                <path d="M0 128 Q16 64 32 128 T64 128" fill="#247d7a"></path>
                <path d="M64 128 Q80 64 96 128 T128 128" fill="#48b2a5"></path>
              </svg>
            </div>
            <span class="record-pin"></span>
          </div>
          <div class="player-card">
            <div class="player-info">
              <div class="info-content">
                <p class="audio-label">Quran Recitation</p>
                <h3 id="audioTitle">الشيخ مشاري العفاسي</h3>
                <p id="audioStatus" class="audio-status">Select a surah to listen.</p>
              </div>
              <div class="reciter-picker">
                <span>Reciter</span>
                <div class="reciter-buttons" role="group" aria-label="Choose reciter">
                  <button class="reciter-btn active" type="button" data-reciter="ar.alafasy" title="الشيخ مشاري العفاسي">العفاسي</button>
                  <button class="reciter-btn" type="button" data-reciter="ar.abdulsamad" title="الشيخ عبد الباسط عبد الصمد">عبدالباسط</button>
                  <button class="reciter-btn" type="button" data-reciter="ar.husary" title="الشيخ الحصري">الحصري</button>
                  <button class="reciter-btn" type="button" data-reciter="ar.minshawi" title="الشيخ المنشاوي">المنشاوي</button>
                </div>
              </div>
            </div>
            <div class="timeline">
              <span id="currentTime">0:00</span>
              <input id="progressBar" type="range" min="0" max="100" value="0" aria-label="Audio progress" />
              <span id="duration">0:00</span>
            </div>
            <div class="player-controls">
              <label class="slider" for="volumeLevel">
                <input id="volumeLevel" type="range" class="level" min="0" max="1" step="0.01" value="1" aria-label="Volume" />
                <svg class="volume" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" aria-hidden="true">
                  <path d="M18.36 19.36a1 1 0 0 1-.705-1.71C19.167 16.148 20 14.142 20 12s-.833-4.148-2.345-5.65a1 1 0 1 1 1.41-1.419C20.958 6.812 22 9.322 22 12s-1.042 5.188-2.935 7.069a.997.997 0 0 1-.705.291z" fill="currentColor"></path>
                  <path d="M15.53 16.53a.999.999 0 0 1-.703-1.711C15.572 14.082 16 13.054 16 12s-.428-2.082-1.173-2.819a1 1 0 1 1 1.406-1.422A6 6 0 0 1 18 12a6 6 0 0 1-1.767 4.241.996.996 0 0 1-.703.289zM12 22a1 1 0 0 1-.707-.293L6.586 17H4c-1.103 0-2-.897-2-2V9c0-1.103.897-2 2-2h2.586l4.707-4.707A.998.998 0 0 1 13 3v18a1 1 0 0 1-1 1z" fill="currentColor"></path>
                </svg>
              </label>
              <button id="repeatBtn" class="player-icon" type="button" aria-label="Repeat off" title="Repeat off">↻</button>
              <button id="audioPrevBtn" class="player-icon" type="button" aria-label="Previous surah" title="Previous surah">|◀</button>
              <button id="playBtn" class="play-button" type="button" aria-label="Play" title="Play">▶</button>
              <button id="audioNextBtn" class="player-icon" type="button" aria-label="Next surah" title="Next surah">▶|</button>
            </div>
          </div>
          <audio id="audioPlayer" preload="metadata"></audio>
        </section>

        <div id="loader" class="loader">Loading surah details...</div>
        <section id="surahContent" class="surah-content" hidden></section>
      </main>
    </div>

    <script src="script.js"></script>
  </body>
</html>
